<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mermoz Lab — Portail</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body {
    font-family: system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    background: #0b3d63;
    color: #fff;
    text-align: center;
  }
  .box { max-width: 420px; padding: 2rem; }
  a { color: #9fd8ff; }
  .spinner {
    width: 28px; height: 28px;
    border: 3px solid rgba(255,255,255,.3);
    border-top-color: #fff;
    border-radius: 50%;
    margin: 0 auto 1rem;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p id="msg">Connexion au site Mermoz Lab…</p>
    <p><a id="fallback-link" href="https://ppruvost.github.io/tableau_sciences/">Cliquez ici si rien ne se passe</a></p>
  </div>

<script>
  // --- Adresses des deux sites ---
  const PRIMARY = "https://mermoz.codeberg.page/";                  // site principal (Codeberg)
  const MIRROR  = "https://ppruvost.github.io/tableau_sciences/";   // site miroir (GitHub Pages)
  const TIMEOUT_MS = 3000;                                          // délai avant de basculer sur le miroir

  function goTo(url) { window.location.replace(url); }

  function checkPrimary() {
    return new Promise((resolve, reject) => {
      const controller = new AbortController();
      const timer = setTimeout(() => {
        controller.abort();
        reject(new Error("timeout"));
      }, TIMEOUT_MS);

      fetch(PRIMARY, { mode: "no-cors", cache: "no-store", signal: controller.signal })
        .then(() => { clearTimeout(timer); resolve(); })
        .catch((err) => { clearTimeout(timer); reject(err); });
    });
  }

  checkPrimary()
    .then(() => goTo(PRIMARY))
    .catch(() => {
      document.getElementById("msg").textContent = "Site principal indisponible, redirection vers le miroir…";
      goTo(MIRROR);
    });
</script>
</body>
</html>
